<nz-card>
  <nz-breadcrumb>
    <nz-breadcrumb-item>
      <a [routerLink]="'/dashboard/home'">
        <i nz-icon nzType="home" theme="outline"></i>
        <span>Home</span>
      </a>
    </nz-breadcrumb-item>
    <nz-breadcrumb-item>Course Materials</nz-breadcrumb-item>
    </nz-breadcrumb>   
    <div class="row m-b-30">
      <div class="col-8">
        <h1 class="page-heading">Course Materials</h1>
      </div>
      <div class="col-lg-4 text-right">
            <a nz-button nzType="primary" [routerLink]="'/admin/coursematerial-add'"> 
                <i nz-icon nzType="plus-circle" theme="outline"></i>
                <span>Add Course Material</span>
            </a>
        </div>
    </div>
    <nz-table #listTable [nzData]="displayData" [nzBordered]="true" [nzShowPagination]="false">
      <thead>
        <tr>
          <th *ngFor="let column of orderColumn" [nzSortFn]="column.compare">
            {{ column.title }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of displayData; let i = index">
          <td>{{ (pageIndex - 1) * pageSize + (i + 1) }}</td>  
          <td>
            <div class="d-flex align-items-center">            
              <nz-avatar
              nzShape="square"
              [nzSize]="60"
              nzIcon="picture"
              [nzSrc]="apiUrl+ item.imageUrl"
            ></nz-avatar>
            <span class="m-l-10">{{ item.courseMaterialName }}</span>              
            </div>
          </td>
          <!--<td>{{ item.subCategoryId.categoryId.categoryName }} </td>
          <td>{{ item.subCategoryId.subCategoryName }}</td>-->
          <td><a href="{{ item.courseMaterialUrl }}" target="_blank"> {{ item.courseMaterialUrl }}</a></td>
          <!--<td>{{ item.type }}</td>-->
          <td>
            <nz-badge
              *ngIf="item.isActive === true"
              nzStatus="success"
            ></nz-badge>
            <nz-badge
              *ngIf="item.isActive === false"
              nzStatus="error"
            ></nz-badge>
            <span class="text-capitalize">{{ item.isActive ? 'Active' : 'Inactive' }}</span>
          </td>
          <td >           
            <a class="m-r-5" nz-button nzType="default" nzShape="circle" nz-tooltip nzTooltipTitle="View" [routerLink]="['/admin/coursematerial-detail', item._id]" >
              <i nz-icon nzType="eye" theme="outline"></i>
            </a>
            <a class="m-r-5" nz-button nzType="default" nzShape="circle" nz-tooltip nzTooltipTitle="Edit" [routerLink]="['/admin/coursematerial-edit', item._id]">
                <i nz-icon nzType="edit" theme="outline"></i>
            </a>
            <button nz-button nzType="default" nzShape="circle" nz-tooltip nzTooltipTitle="Delete" (click)="deleteItem('/api/coursematerial', item._id)">
                <i nz-icon nzType="delete" theme="outline"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </nz-table>
    <div class="pagination-container">
      <nz-pagination [(nzPageIndex)]="pageIndex" [nzPageSize]="pageSize" [nzTotal]="total" (nzPageIndexChange)="onPageChange($event)"></nz-pagination>  
    </div>  
  </nz-card>
