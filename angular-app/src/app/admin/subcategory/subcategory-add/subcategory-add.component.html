<nz-card>
    <nz-breadcrumb>
        <nz-breadcrumb-item>
          <a [routerLink]="'/dashboard/home'">
            <i nz-icon nzType="home" theme="outline"></i>
            <span>Home</span>
          </a>
        </nz-breadcrumb-item>
        <nz-breadcrumb-item>
          <a [routerLink]="'/admin/subcategories'">
            <span>Sub Categories</span>
          </a>
        </nz-breadcrumb-item>
        <nz-breadcrumb-item>Add Sub Category</nz-breadcrumb-item>
    </nz-breadcrumb>  
    <div class="row m-b-30">
      <div class="col-12">
        <h1 class="page-heading">Add Sub Category</h1>
      </div>
    </div>
    <form nz-form [formGroup]="submitDataForm" class="login-form" nzLayout="vertical" (ngSubmit)="submitForm()">
        <div class="col-lg-12">
            <div class="d-md-flex">
                <div class="col-md-4 m-b-10 m-r-10">        
                    <nz-form-item>
                        <nz-form-label nzRequired nzFor="subCategoryName">Sub Category Name</nz-form-label>
                        <nz-form-control nzErrorTip="Please input Sub Category Name!">
                            <input type="text" nz-input formControlName="subCategoryName" placeholder="Sub Category Name" id="subCategoryName">
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-4 m-b-10 m-r-10">         
                    <nz-form-item>
                        <nz-form-label nzFor="imageUpload">Image</nz-form-label>
                        <nz-form-control>
                            <input 
                                type="file" 
                                nz-input 
                                (change)="onFileChange($event)" 
                                id="imageUpload" 
                                name="imageUpload"
                                accept="image/*"
                            >
                            <div *ngIf="imageError" class="error">{{ imageError }}</div>                           
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-4 m-b-10 m-r-10">  
                    <nz-form-item>
                        <nz-form-label nzFor="sorting">Image Preview</nz-form-label>
                        <!-- Image Preview -->
                        <div *ngIf="imagePreviewUrl" class="image-preview">
                            <img 
                                [src]="imagePreviewUrl" 
                                alt="Image Preview" 
                                class="img-thumbnail preview-img"
                            />
                        </div>
                    </nz-form-item>  
                </div>                
            </div>                
        </div>  
        <div class="col-lg-12">
            <div class="d-md-flex">
                <div class="col-md-4 m-b-10 m-r-10">         
                    <nz-form-item>
                        <nz-form-label nzRequired nzFor="sorting">Sorting</nz-form-label>
                        <nz-form-control nzErrorTip="Please input Sorting number!">
                            <input type="number" nz-input formControlName="sorting" placeholder="Sorting" id="sorting">
                        </nz-form-control>
                    </nz-form-item>
                </div>              
                <div class="col-md-4 m-b-10 m-r-10">         
                    <nz-form-item>
                        <nz-form-label nzRequired nzFor="type">Type</nz-form-label>
                        <nz-form-control nzErrorTip="Please Select Type!">
                            <nz-select
                            id="type" (ngModelChange)="onTypeChange($event)"
                            formControlName="type"
                            class="form-control"
                            >
                            <nz-option nzLabel="Select" nzValue=""></nz-option>
                            <nz-option nzLabel="Kid" nzValue="kid"></nz-option>
                            <nz-option nzLabel="Parent" nzValue="parent"></nz-option>
                            </nz-select>
                        </nz-form-control>
                    </nz-form-item>
                </div>  
                <div class="col-md-4 m-b-10 m-r-10">        
                    <nz-form-item>
                        <nz-form-label nzRequired nzFor="categoryId">Category</nz-form-label>
                        <nz-form-control nzErrorTip="Please select Category!">
                            <nz-select
                            id="categoryId"
                            formControlName="categoryId"
                            class="form-control" >
                            >
                            <nz-option nzLabel="Select" nzValue=""></nz-option>
                            <nz-option *ngFor="let category of categories"  [nzLabel]="category.categoryName" [nzValue]="category._id"> </nz-option>
                            </nz-select>                            
                        </nz-form-control>
                    </nz-form-item>
                </div>                                
            </div>
        </div> 
        <div class="col-lg-12">
            <div class="d-md-flex">
                <div class="col-md-8 m-b-10 m-r-10">        
                    <nz-form-item>
                        <nz-form-label  nzFor="Description">Description</nz-form-label>
                        <textarea nz-input id="description"
                        formControlName="description"
                        class="form-control"
                        placeholder="Enter description"></textarea>                        
                    </nz-form-item>
                </div>
                <div class="col-md-4 m-b-10 m-r-10">         
                    <nz-form-item>
                        <nz-form-label nzRequired nzFor="isActive">Status</nz-form-label>
                        <nz-radio-group id="isActive"  formControlName="isActive" [(ngModel)]="isActive">
                            
                            <label nz-radio-button nzValue="true" >Active</label>
                            <label nz-radio-button nzValue="false">Inactive</label>
                        </nz-radio-group>   
                    </nz-form-item>
                </div>                
            </div>
        </div>   
        <div class="d-flex align-items-center justify-content-between">    
            <div></div>       
            <nz-form-item>
                <nz-form-control>
                    <div >
                        <button nz-button class="form-button" [nzType]="'primary'">Submit</button>
                    </div>
                </nz-form-control>
            </nz-form-item>   
        </div> 
    </form>
  </nz-card>
